<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Яка ти емоція сьогодні?</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, rgba(26, 58, 96, 0.85) 0%, rgba(13, 27, 42, 0.9) 100%), 
            url('https://i.ibb.co/v6d7Gzns/image.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: #fff;
        }
        .card { 
            background: rgba(17, 34, 64, 0.95); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 380px; 
            border: 2px solid #204578;
        }
        h2 { margin: 0 0 6px; color: #64ffda; font-size: 22px; }
        .info { font-style: italic; margin-bottom: 15px; color: #8892b0; }
        button { 
            background: #2081c3; 
            color: #fff; 
            font-size: 20px; 
            font-weight: bold; 
            border: none; 
            border-radius: 10px; 
            padding: 12px; 
            width: 100%; 
            cursor: pointer; 
            margin-bottom: 15px; 
            transition: background 0.2s;
        }
        button:hover { background: #2a9df4; }
        button:disabled { background: #233554; color: #495670; cursor: not-allowed; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            background: #0a192f; 
            padding: 8px; 
            border-radius: 10px; 
            border: 2px solid #1d3557;
        }
        .cell { 
            background: #172a45; 
            border: 2px solid #303c55; 
            height: 95px; 
            overflow: hidden;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-radius: 6px;
        }
        .cell img {
            width: 250%;
            height: 250%;
            object-fit: cover;
            object-position: center 30%;
        }
		
        .emotion-0 { object-position: 50% 25%; }
        .emotion-1 { object-position: 50% 40%; }
        .emotion-2 { object-position: 50% 55%; }
        .emotion-3 { object-position: 30% 35%; }
        .emotion-4 { object-position: 70% 35%; }

        .win { background: #ffd700 !important; border-color: #ffa500 !important; }
        .msg { margin-top: 15px; font-weight: bold; font-size: 18px; min-height: 24px; }
        #restart { background: #334155; color: #e2e8f0; display: none; }
        #restart:hover { background: #475569; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="name">Євген Давиденко</h2>
    <div class="info" id="info">Які ваші сьогодні емоції 0 з 3?</div>
    <button id="gen">Сгенерувати</button>
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg"></div>
    <button id="restart">Грати знову</button>
</div>

<script>
    const F = [
        '<img src="https://i.ibb.co/k6r96gjW/sad.png" class="emotion-0" alt="Emition 1">',
        '<img src="https://i.ibb.co/HSZV3tz/smileface.png" class="emotion-1" alt="Emition 2">',
        '<img src="https://i.ibb.co/WvNptCsT/waterinface.png" class="emotion-2" alt="Emition 3">',
        '<img src="https://i.ibb.co/9kQSbS9r/seriousman.png"" class="emotion-3" alt="Emition 4">',
        '<img src="https://i.ibb.co/Z6vRSnxV/pashalco.png" class="emotion-4" alt="Emition 5">'
    ];

    let attempt = 0, user = prompt("Введіть ім'я:", "Євген Давиденко") || "Євген Давиденко";
    document.getElementById('name').textContent = user;

    const rndCol = () => [0,1,2,3,4].sort(() => Math.random() - 0.5).slice(0, 3);

    const draw = (matrix, winRow = -1) => {
        let html = '';
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
                html += `<div class="cell ${r === winRow ? 'win' : ''}">${F[matrix[r][c]]}</div>`;
            }
        }
        document.getElementById('grid').innerHTML = html;
    };

    const initBoard = () => {
        let m = Array.from({length: 3}, () => [0,0,0]);
        for (let c = 0; c < 3; c++) {
            let col = rndCol();
            for (let r = 0; r < 3; r++) m[r][c] = col[r];
        }
        draw(m);
    };

    initBoard();

    document.getElementById('gen').onclick = () => {
        if (attempt >= 3) return;
        attempt++;
        document.getElementById('info').textContent = `Емоція ${attempt} з 3`;

        let m = Array.from({length: 3}, () => [0,0,0]);
        for (let c = 0; c < 3; c++) {
            let col = rndCol();
            for (let r = 0; r < 3; r++) m[r][c] = col[r];
        }

        let winRow = -1;
        for (let r = 0; r < 3; r++) {
            if (m[r][0] === m[r][1] && m[r][1] === m[r][2]) winRow = r;
        }

        draw(m, winRow);

        if (winRow !== -1) {
            document.getElementById('msg').textContent = `Вітаємо, ${user}! Ви перемогли!`;
            document.getElementById('msg').style.color = '#64ffda';
            end();
        } else if (attempt === 3) {
            document.getElementById('msg').textContent = `На жаль, ${user}, ви програли.`;
            document.getElementById('msg').style.color = '#ff6b6b';
            end();
        }
    };

    function end() {
        document.getElementById('gen').disabled = true;
        document.getElementById('restart').style.display = 'block';
    }

    document.getElementById('restart').onclick = () => {
        attempt = 0;
        document.getElementById('info').textContent = 'Які ваші сьогодні емоції 0 з 3';
        document.getElementById('msg').textContent = '';
        document.getElementById('gen').disabled = false;
        document.getElementById('restart').style.display = 'none';
        initBoard();
    };
</script>

</body>
</html>
