<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магічна куля</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 30%, #fff09a, #ffd23f 30%, #ff9d00 55%, #f05a00 75%, #6b2100);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 500px;
            padding: 30px;
            text-align: center;
            background: #5a320b;
            border: 2px solid #ffb300;
            border-radius: 10px;
        }

        .question {
            width: 90%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: #ffd66b;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .error {
            height: 25px;
            margin-top: 5px;
            color: red;
        }

        .ball {
            width: 400px;
            height: 400px;
            margin: 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff09a, #ffd23f 30%, #ff9d00 55%, #f05a00 75%, #6b2100);
            border: 6px solid #3a1b05;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px #ffb300, 0 0 30px #ff7200;
            position: relative;
            overflow: hidden;
        }

        .ball::before {
            content: "";
            position: absolute;
            width: 120px;
            height: 50px;
            top: 35px;
            left: 30px;
            background: white;
            border-radius: 50%;
            opacity: 0.35;
            transform: rotate(-30deg);
        }

        .answer {
            color: white;
            font-size: 30px;
            text-shadow: 0 0 5px black;
            z-index: 2;
        }

        .button {
            padding: 12px 35px;
            border: none;
            border-radius: 20px;
            background: #FF8C00;
            color: black;
            font-size: 18px;
            cursor: pointer;
        }

        .button:hover {
            background: white;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            .ball {
                width: 280px;
                height: 280px;
            }

            .answer {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <input id="question" class="question" type="text" placeholder="Введіть своє питання">
        <div id="error" class="error"></div>

        <div class="ball">
            <div id="answer" class="answer">?</div>
        </div>

        <button id="askBtn" class="button">Натисни. Манго, манго..</button>
    </div>

    <script>
        "use strict";

        const questionInput = document.getElementById("question");
        const errorBox = document.getElementById("error");
        const answerBox = document.getElementById("answer");
        const askBtn = document.getElementById("askBtn");

        const answers = [
            "Так!",
            "Ні!",
            "Можливо"
        ];

        function askBall() {
            const text = questionInput.value.trim();

            if (!text) {
                errorBox.textContent = "Введіть питання!";
                return;
            }

            if (text.length < 3) {
                errorBox.textContent = "Питання занадто коротке!";
                return;
            }

            errorBox.textContent = "";
            const randomIndex = Math.floor(Math.random() * answers.length);
            answerBox.textContent = answers[randomIndex];
        }

        askBtn.addEventListener("click", askBall);

        questionInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                askBall();
            }
        });
    </script>

</body>
</html>
